<title>弧度法ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 1カラム(最大700px) 設定パネル → 問題カード(選択肢2x2・ヒントボタン・解説・単位円) → 結果。
   ベースはピンク。選ばれていない選択肢・ボタンは薄いブルーのまま（黒枠にしない）。 */
:root{
  --bg:#fff0f6; --surface:#ffffff; --ink:#3b1530; --muted:#785069; --line:#f6cde0;
  --accent:#d6336c; --accent-ink:#ffffff; --soft:#ffe0ec; --soft-ink:#a61e4d;
  --on-choice:#1b3f95; --choice:#e4f0ff; --choice-hover:#d3e6ff; --choice-line:#b9d5f7;
  --ok:#157347; --ok-bg:#dcf5e7; --ok-line:#8fd5ad;
  --ng:#b4281f; --ng-bg:#fde4e1; --ng-line:#f0a9a2;
  --hlx:#0e7f84; --hly:#d4560f;
  --axis:#a68698; --circle:#5a2a48; --circle-fill:#fff8fb;
  --font-ui:'Zen Maru Gothic',system-ui,'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --font-math:'STIX Two Text','Times New Roman','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a1020; --surface:#3a1830; --ink:#ffe9f2; --muted:#e0b3c8; --line:#5e2a48;
    --accent:#ff8fb8; --accent-ink:#3a0f24; --soft:#52223f; --soft-ink:#ffc2d9;
    --on-choice:#cfe0ff; --choice:#1d3150; --choice-hover:#264168; --choice-line:#34517d;
    --ok:#6fdc9f; --ok-bg:#123826; --ok-line:#2d7a53;
    --ng:#ff9a90; --ng-bg:#4a1c1c; --ng-line:#8a3a37;
    --hlx:#5dd6d0; --hly:#ffa05c;
    --axis:#b58aa0; --circle:#ffc2d9; --circle-fill:#2e1226;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a1020; --surface:#3a1830; --ink:#ffe9f2; --muted:#e0b3c8; --line:#5e2a48;
  --accent:#ff8fb8; --accent-ink:#3a0f24; --soft:#52223f; --soft-ink:#ffc2d9;
  --on-choice:#cfe0ff; --choice:#1d3150; --choice-hover:#264168; --choice-line:#34517d;
  --ok:#6fdc9f; --ok-bg:#123826; --ok-line:#2d7a53;
  --ng:#ff9a90; --ng-bg:#4a1c1c; --ng-line:#8a3a37;
  --hlx:#5dd6d0; --hly:#ffa05c;
  --axis:#b58aa0; --circle:#ffc2d9; --circle-fill:#2e1226;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:18px;line-height:1.6;padding-block:18px 48px}
.wrap{max-width:700px;margin-inline:auto;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;gap:12px;align-items:center}
.top>div{min-width:0}
.logo{width:50px;height:50px;flex:none;color:var(--accent)}
.logo.chara{width:62px;height:61px}
.top h1{white-space:nowrap}
.top .snd{padding-inline:8px}
h1{margin:0;font-size:1.8rem;font-weight:900;line-height:1.2;letter-spacing:.02em}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem;line-height:1.45}

.panel,.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px}
.panel{padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lab{font-size:.85rem;font-weight:700;color:var(--soft-ink);letter-spacing:.06em;min-width:3.4rem}
.seg{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.seg button{background:var(--choice);color:var(--on-choice);border:2px solid var(--choice-line);border-radius:12px;padding:8px 14px;min-height:48px;font-size:1rem;font-weight:700;cursor:pointer}
.seg button:hover{background:var(--choice-hover)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.steps button{display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:7px 4px}
.seg.steps small{font-size:.8rem;font-weight:500}
.row.steprow{align-items:flex-start}

.card{padding:18px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;font-weight:700;color:var(--muted)}
.chip{background:var(--soft);color:var(--soft-ink);border-radius:999px;padding:2px 14px}
.bar{height:8px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
.qlabel{margin:16px 0 0;text-align:center;font-size:.92rem;font-weight:700;letter-spacing:.06em;color:var(--soft-ink)}
.rep{display:inline-block;margin-right:.6em;padding:0 10px;border-radius:99px;background:var(--ng-bg);color:var(--ng);border:1px solid var(--ng-line);letter-spacing:.04em}
.q{font-family:var(--font-math);font-size:clamp(2.4rem,11.5vw,3.5rem);text-align:center;line-height:1.3;padding:6px 0 18px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:1.6em;border-bottom:4px solid var(--accent);color:var(--accent);line-height:1.1;margin-inline:.1em}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;align-items:center;gap:6px;min-height:92px;padding:10px 10px;background:var(--choice);color:var(--ink);border:2.5px solid var(--choice-line);border-radius:16px;cursor:pointer;text-align:center}
.choice:hover:not(:disabled){background:var(--choice-hover)}
.choice .no{flex:none;width:1.6rem;font-size:1.1rem;color:var(--on-choice);opacity:.85}
.choice .val{flex:1;min-width:0;font-family:var(--font-math);font-size:clamp(1.8rem,8.5vw,2.3rem);line-height:1.25}
.choice:disabled{cursor:default}
.choice.is-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.choice.is-ok .no{color:var(--ok);opacity:1;font-weight:900}
.choice.is-ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ink)}
.choice.is-ng .no{color:var(--ng);opacity:1;font-weight:900}
.choice.is-dim{opacity:.55}
.und{font-family:var(--font-ui);font-size:.58em;font-weight:700;line-height:1.3;display:inline-block}

.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.hlabel{grid-column:1/-1;font-size:.85rem;font-weight:700;color:var(--soft-ink);letter-spacing:.06em}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:10px 20px;min-height:50px;font-size:1.05rem;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--choice);color:var(--on-choice);border:2px solid var(--choice-line)}
.btn.ghost:hover{background:var(--choice-hover)}
.btn.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions .btn{padding:8px 10px;font-size:.98rem;line-height:1.35}
.snd{margin-left:auto;flex:none;min-height:42px;padding:6px 12px;font-size:.9rem}

.hint{margin-top:14px;padding:12px;border-radius:14px;background:var(--bg);border:2px dashed var(--line)}
.hint .tip{margin:0 0 8px;font-size:1rem}
.hint .note{margin:6px 0 0;font-size:.88rem;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.hint .note .kx{color:var(--hlx);font-weight:700}
.hint .note .ky{color:var(--hly);font-weight:700}
.uc{width:100%;height:auto;display:block}
.uc .u-circ{fill:var(--circle-fill);stroke:var(--circle);stroke-width:2.5}
.uc .u-ax{stroke:var(--axis);stroke-width:1.5}
.uc .u-sp{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 4;opacity:.75}
.uc .u-tk{stroke:var(--circle);stroke-width:2.5}
.uc .u-dot{fill:var(--circle)}
.uc .u-dot.on{fill:var(--accent)}
.uc .u-hl{stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.uc .u-arc{fill:none;stroke:var(--accent);stroke-width:2.5}
.uc .u-foot{stroke:var(--axis);stroke-width:1.5;stroke-dasharray:4 3}
.uc .u-hy{stroke:var(--hly);stroke-width:5;stroke-linecap:round}
.uc .u-hx{stroke:var(--hlx);stroke-width:5;stroke-linecap:round}
.uc text{font-family:var(--font-math);fill:var(--ink)}
.uc .u-tan{stroke:var(--hlx);stroke-width:3.5;stroke-linecap:round}
.uc .u-ext{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 4;opacity:.75}
.uc .u-hext{stroke:var(--accent);stroke-width:3.5;stroke-dasharray:9 6;stroke-linecap:round}
.uc .u-ld{stroke:var(--axis);stroke-width:1.2;opacity:.7}
.uc .u-ld.on{stroke:var(--accent);stroke-width:2.5;opacity:1}
.uc .fo{display:flex;width:100%;height:100%;font-family:var(--font-math);color:var(--ink);font-size:24px;line-height:1.1}
.uc .lb{display:inline-flex;align-items:center;gap:.15em;white-space:nowrap;font-weight:700;padding:1px 5px;border-radius:8px;background:var(--circle-fill)}
.uc .lb.on{color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.uc .lb.tn{color:var(--hly);box-shadow:0 0 0 2px var(--hly);font-size:22px}
.uc .lb.v{flex-direction:column;gap:0;align-items:flex-start;line-height:1.05}
.uc .lb.v .co2{margin-left:0}
.uc .rl{display:inline-flex;align-items:center;white-space:nowrap}
.uc .arw{color:var(--muted);font-weight:400;margin:0 .1em}
.uc .co2{display:inline-flex;align-items:center;font-size:.78em;font-weight:400;color:var(--muted);margin-left:.4em}
.uc .co2 .hx{color:var(--hlx);font-weight:700}
.uc .co2 .hy{color:var(--hly);font-weight:700}
.uc .u-tv{font-size:17px;fill:var(--muted)}
.uc .u-tv.on{font-size:20px;font-weight:700;fill:var(--hly)}
.uc .u-x1{font-size:19px;font-weight:700;fill:var(--hlx)}
.uc .u-und{font-size:17px;font-weight:700;fill:var(--hly)}
.uc .u-halo{paint-order:stroke;stroke:var(--circle-fill);stroke-width:5px;stroke-linejoin:round}
.uc .u-rad{font-size:22px;font-weight:700}
.uc .u-rad.on{fill:var(--accent)}
.uc .u-co{font-size:17px;fill:var(--muted)}
.uc .u-co .hx{fill:var(--hlx);font-weight:700}
.uc .u-co .hy{fill:var(--hly);font-weight:700}
.uc .u-deg{font-size:14.5px;fill:var(--muted);paint-order:stroke;stroke:var(--circle-fill);stroke-width:4px;stroke-linejoin:round}

.fb{margin-top:14px;padding:14px 16px;border-radius:14px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.ng{background:var(--ng-bg);border-color:var(--ng-line)}
.fb .ft{margin:0;font-weight:900;font-size:1.25rem}
.fb.ok .ft{color:var(--ok)} .fb.ng .ft{color:var(--ng)}
.fb .ex{margin:4px 0 8px;font-size:1.05rem}
.fb .nt{margin:0 0 12px;font-size:.95rem;color:var(--muted)}

.m{font-family:var(--font-math);font-size:1.12em;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin-inline:.12em}
.frac>span:first-child{border-bottom:.07em solid currentColor;padding:0 .22em .06em}
.frac>span:last-child{padding-top:.06em}
.sqrt{white-space:nowrap}
.sqrt .rd{border-top:.07em solid currentColor;padding:0 .06em;margin-left:.02em}

.res-label{margin:0;font-size:.9rem;font-weight:700;letter-spacing:.06em;color:var(--soft-ink)}
.res-score{margin:0;font-family:var(--font-math);font-size:4rem;line-height:1.2;font-weight:700;color:var(--accent)}
.res-score small{font-size:1.6rem;color:var(--muted)}
.zab{display:block;font-size:1.7rem;font-weight:900;color:var(--accent);margin-bottom:4px;line-height:1.3}
.zab.ng{color:var(--ng)}
.res-msg{margin:4px 0 12px;font-size:1.1rem}
.wlist{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.wlist li{background:var(--ng-bg);border:1px solid var(--ng-line);border-radius:10px;padding:6px 12px;font-family:var(--font-math);font-size:1.45rem}
.res-actions{display:flex;gap:10px;flex-wrap:wrap}
.res-sub{font-size:.9rem;color:var(--muted);margin:0 0 12px}

[hidden]{display:none!important}
.row.wide .lab{display:none}
.row.wide .seg{width:100%}
#segMode{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#segMode button{padding:8px 2px;font-size:.84rem;line-height:1.35;white-space:nowrap}
#segTab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#segTab button{padding-inline:2px;white-space:nowrap;font-size:.95rem}
.gsvg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.gsvg .g-circ{fill:var(--circle-fill);stroke:var(--circle);stroke-width:3}
.gsvg .g-ax{stroke:var(--axis);stroke-width:1.5}
.gsvg .g-sp{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.gsvg .g-fill{fill:var(--accent);fill-opacity:.5;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.gsvg .g-ans{fill:var(--ok);fill-opacity:.18;stroke:var(--ok);stroke-width:4;stroke-dasharray:9 6;stroke-linejoin:round}
.gsvg .g-ans.hide,.gsvg .g-fill.hide{display:none}
.gsvg .g-fill.ng{fill:var(--ng);fill-opacity:.35;stroke:var(--ng)}
.gsvg .g-fill.ok{fill:var(--ok);fill-opacity:.4;stroke:var(--ok)}
.gsvg .g-tk{stroke:var(--circle);stroke-width:3}
.gsvg .g-dot{fill:var(--circle)}
.gsvg .g-dot.on{fill:var(--accent)}
.gsvg .g-start{stroke:var(--hlx);stroke-width:5;stroke-linecap:round}
.gsvg text{font-family:var(--font-ui);font-weight:700;fill:var(--hlx);font-size:15px}
.gtip{margin:6px 0 0;text-align:center;font-size:.95rem;color:var(--muted);font-weight:700}
.gbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:14px}
.gfb{margin-top:14px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);text-align:center}
.gfb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.gfb.ng{background:var(--ng-bg);border-color:var(--ng-line)}
#gKind{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#gKind button{padding:8px 2px;line-height:1.3;white-space:nowrap}
#gKind small{font-weight:500;font-size:.8rem}
.gfb .ft{margin:0;font-size:1.3rem;font-weight:900}
.gfb.ok .ft{color:var(--ok)} .gfb.ng .ft{color:var(--ng)}
.gfb .ex{margin:4px 0 10px;font-family:var(--font-math);font-size:1.45rem}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>

<main class="wrap">
  <header class="top">
    <svg class="logo chara" viewBox="0 0 86 84" role="img" aria-label="落語家のキャラクター">
      <rect x="6" y="70" width="68" height="11" rx="5" fill="#c2255c"/>
      <rect x="6" y="70" width="68" height="3" rx="1.5" fill="#e64980"/>
      <path d="M14 72C14 57 24 50 40 50s26 7 26 22z" fill="#1d5a3b"/>
      <path d="M31 50l9 16 9-16" fill="#f3f0e6"/>
      <path d="M32 50l8 14 8-14" fill="none" stroke="#b9c9bd" stroke-width="1.5"/>
      <rect x="36" y="42" width="8" height="9" fill="#f0c9a4"/>
      <ellipse cx="26.5" cy="27" rx="2.6" ry="4" fill="#f0c9a4"/><ellipse cx="53.5" cy="27" rx="2.6" ry="4" fill="#f0c9a4"/>
      <ellipse cx="40" cy="26" rx="13" ry="18" fill="#ffd9b8"/>
      <path d="M27.5 17C27 9 33 5.5 40 5.5S53 9 52.5 17c-2-2.5-4.5-3.8-6-4.2-3.8-.7-8-.9-12 0-1.5.4-4 1.7-6 4.2z" fill="#2f2723"/>
      <path d="M31 24.500q3-3 6.500-.8M42.500 23.700q3.500-2.200 6.500.8" fill="none" stroke="#2f2723" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 28.500q2.800 2.800 5.600 0M42.400 28.500q2.800 2.800 5.600 0" fill="none" stroke="#2f2723" stroke-width="2.100" stroke-linecap="round"/>
      <path d="M40 29v6" stroke="#e5b58c" stroke-width="1.500" stroke-linecap="round"/>
      <path d="M35 39q5 4.500 10 0" fill="#fff" stroke="#8a3b2e" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="34" r="2.400" fill="#ff9aa9" opacity=".5"/><circle cx="49" cy="34" r="2.400" fill="#ff9aa9" opacity=".5"/>
      <g><path d="M58 63L35.8 57.0A23 23 0 0 1 80.2 57.0z" fill="#ffe066" stroke="#c2255c" stroke-width="1.6" stroke-linejoin="round"/><path d="M58 63L35.8 57.0A23 23 0 0 1 38.1 51.5z" fill="#f08c00" opacity=".35"/><path d="M58 63L41.7 46.7A23 23 0 0 1 46.5 43.1z" fill="#f08c00" opacity=".35"/><path d="M58 63L52.0 40.8A23 23 0 0 1 58.0 40.0z" fill="#f08c00" opacity=".35"/><path d="M58 63L64.0 40.8A23 23 0 0 1 69.5 43.1z" fill="#f08c00" opacity=".35"/><path d="M58 63L74.3 46.7A23 23 0 0 1 77.9 51.5z" fill="#f08c00" opacity=".35"/><path d="M58 63L35.8 57.0M58 63L41.7 46.7M58 63L52.0 40.8M58 63L64.0 40.8M58 63L74.3 46.7M58 63L80.2 57.0" stroke="#c2255c" stroke-width="1.1"/><circle cx="58" cy="63" r="1.6" fill="#c2255c"/></g>
      <circle cx="58" cy="65" r="4.200" fill="#ffd9b8"/>
    </svg>
    <div>
      <h1>弧度法ドリル</h1>
      <p>度数法と弧度法の変換、sin・cos・tan を、単位円を見ながら身につけよう</p>
    </div>
    <button type="button" class="btn ghost snd" id="sndBtn" aria-pressed="true">音 ON</button>
  </header>

  <section class="panel" aria-label="あそびかた">
    <div class="row wide"><span class="lab">モード</span>
      <div class="seg" id="segMode" role="group" aria-label="ドリルかゲームか">
        <button type="button" data-v="game" aria-pressed="false">①<br>角度・弧度<br>ぬりえ</button>
        <button type="button" data-v="conv" aria-pressed="true">②<br>角度⇔弧度</button>
        <button type="button" data-v="trig" aria-pressed="false">③<br>sin cos tan<br>ミックス</button>
      </div>
    </div>
  </section>

  <section class="panel" id="setPanel" aria-label="問題の設定">
    <div class="row wide" id="rowTab"><span class="lab">種類</span>
      <div class="seg" id="segTab" role="group" aria-label="問題の種類">
        <button type="button" data-v="sin" aria-pressed="false">sin</button>
        <button type="button" data-v="cos" aria-pressed="false">cos</button>
        <button type="button" data-v="tan" aria-pressed="false">tan</button>
        <button type="button" data-v="mix" aria-pressed="false">ミックス</button>
      </div>
    </div>
    <div class="row" id="rowDir"><span class="lab">変換</span>
      <div class="seg" id="segDir" role="group" aria-label="変換の向き">
        <button type="button" data-v="d2r" aria-pressed="true">度数法 → 弧度法</button>
        <button type="button" data-v="r2d" aria-pressed="false">弧度法 → 度数法</button>
      </div>
    </div>
    <div class="row steprow"><span class="lab">範囲</span>
      <div class="seg steps" id="segRange" role="group" aria-label="角度の範囲">
        <button type="button" data-v="0" aria-pressed="true"><b>STEP 1</b><small>0°〜180°</small></button>
        <button type="button" data-v="1" aria-pressed="false"><b>STEP 2</b><small>180°〜360°</small></button>
        <button type="button" data-v="2" aria-pressed="false"><b>STEP 3</b><small>すべて</small></button>
      </div>
    </div>
  </section>

  <section class="card" id="quiz" aria-label="問題">
    <div class="meta"><span id="qNo">第 1 問</span><span class="chip" id="scoreChip">正解 0</span></div>
    <div class="bar"><i id="barFill" style="width:0"></i></div>
    <p class="qlabel" id="qLabel"></p>
    <div class="q" id="qText"></div>

    </svg>
    <p class="gtip">スタート（右の線）から反時計まわりに、目もりを指でおすと、すぐに答え合わせ。ドラッグのときは、指をはなした場所で答え合わせ。</p>
    <div class="gfb" id="gFb" hidden role="status" aria-live="polite">

      <button type="button" class="btn ghost" id="gHintFull" aria-pressed="false">単位円（数字・文字あり）</button>

    <p class="res-msg" id="gResMsg"></p>

  </section>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var gcd=function(a,b){return b?gcd(b,a%b):a};
  var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};

  /* ---------- 角度データ ---------- */
  var R1=[30,45,60,90,120,135,150,180], R2=[210,225,240,270,300,315,330,360];
  var ANG=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];
  function anglesFor(range,trig){
    var a=range===0?R1.slice():range===1?R2.slice():R1.concat(R2);
    if(trig && range!==1) a.unshift(0);
    return a;
  }
  var SIN={0:'0',30:'1/2',45:'1/r2',60:'r3/2',90:'1',120:'r3/2',135:'1/r2',150:'1/2',180:'0',210:'-1/2',225:'-1/r2',240:'-r3/2',270:'-1',300:'-r3/2',315:'-1/r2',330:'-1/2',360:'0'};
  var COS={0:'1',30:'r3/2',45:'1/r2',60:'1/2',90:'0',120:'-1/2',135:'-1/r2',150:'-r3/2',180:'-1',210:'-r3/2',225:'-1/r2',240:'-1/2',270:'0',300:'1/2',315:'1/r2',330:'r3/2',360:'1'};
  var TAN={0:'0',30:'1/r3',45:'1',60:'r3',90:'N',120:'-r3',135:'-1',150:'-1/r3',180:'0',210:'1/r3',225:'1',240:'r3',270:'N',300:'-r3',315:'-1',330:'-1/r3',360:'0'};
  var TBL={sin:SIN,cos:COS,tan:TAN};
  var POOLV={sin:['0','1','-1','1/2','-1/2','1/r2','-1/r2','r3/2','-r3/2'],tan:['0','1','-1','1/r3','-1/r3','r3','-r3','N']};
  POOLV.cos=POOLV.sin;

  /* ---------- 表示用の整形 ---------- */
  function frac(n,d){return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>'}
  function sq(n){return '<span class="sqrt">√<span class="rd">'+n+'</span></span>'}
  function M(h){return '<span class="m">'+h+'</span>'}
  function radParts(deg){var g=gcd(deg,180);return {n:deg/g,d:180/g}}
  function radHTML(deg){
    if(deg===0) return '0';
    var p=radParts(deg);
    return p.d===1?(p.n===1?'':p.n)+'π':piFrac(p.n,p.d);
  }
  /* πは分数の横棒の右どなりに置く（例：3/4 の右に π） */
  function piFrac(n,d){return n===1?frac('π',d):frac(n,d)+'π'}
  function radText(a){
    if(a===0) return '0, 2π';
    var p=radParts(a);
    if(p.d>1) return p.n===1?'π/'+p.d:p.n+'/'+p.d+'π';
    return (p.n===1?'':p.n)+'π';
  }
  function tokHTML(t){
    if(t==='N') return '<span class="und">定義できない</span>';
    var neg=t.charAt(0)==='-'; if(neg) t=t.slice(1);
    var part=function(x){return x.charAt(0)==='r'?sq(x.slice(1)):x};
    var body=t.indexOf('/')>=0?(function(){var ab=t.split('/');return frac(part(ab[0]),part(ab[1]))})():part(t);
    return (neg?'−':'')+body;
  }
  function tokText(t){
    if(t==='N') return '定義できない';
    var neg=t.charAt(0)==='-'; if(neg) t=t.slice(1);
    return (neg?'−':'')+t.replace(/r/g,'√');
  }

  /* ---------- 状態 ---------- */
  var ST={tab:'conv',dir:'d2r',range:0,qs:[],n:0,i:0,score:0,mistakes:0,answered:false,wrong:[],hintMode:null,timer:null};
  var KEY='radian-drill-v1', soundOn=true;
  try{var sv=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(['conv','sin','cos','tan','mix'].indexOf(sv.tab)>=0) ST.tab=sv.tab;
    if(sv.dir==='d2r'||sv.dir==='r2d') ST.dir=sv.dir;
    if(sv.range===0||sv.range===1||sv.range===2) ST.range=sv.range;
    if(sv.sound===false) soundOn=false;
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({tab:ST.tab,dir:ST.dir,range:ST.range,sound:soundOn}))}catch(e){}}

  /* 正解の位置が①〜④に偏らないよう、使用回数がいちばん少ない位置から選ぶ */
  var posCount=[0,0,0,0];
  function pickPos(){
    var m=Math.min.apply(null,posCount), c=[];
    for(var i=0;i<4;i++) if(posCount[i]===m) c.push(i);
    var p=c[Math.floor(Math.random()*c.length)];
    posCount[p]++; return p;
  }

  /* ---------- 効果音（Web Audio） ---------- */
  var AC=null;
  function ac(){
    if(!soundOn) return null;
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
      return AC;
    }catch(e){return null}
  }
  function note(c,f,t,d,type,v,lp){
    var o=c.createOscillator(), g=c.createGain(), t1=c.currentTime+t;
    o.type=type; o.frequency.setValueAtTime(f,t1);
    g.gain.setValueAtTime(0.0001,t1);
    g.gain.exponentialRampToValueAtTime(v,t1+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t1+d);
    if(lp){var fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g)}
    else o.connect(g);
    g.connect(c.destination);
    o.start(t1); o.stop(t1+d+0.05);
  }
  function sfxOk(){ /* ピンポーン（高い「ピン」→ 低くのびる「ポーン」） */
    var c=ac(); if(!c) return;
    [[1319,0,.22],[988,.17,1.05]].forEach(function(n){
      note(c,n[0],n[1],n[2],'sine',.32);
      note(c,n[0]*2,n[1],n[2]*.55,'sine',.07);
    });
  }
  function sfxNg(){ /* ブッ ブー */
    var c=ac(); if(!c) return;
    [[0,.16],[.26,.6]].forEach(function(n){
      note(c,140,n[0],n[1],'sawtooth',.2,650);
      note(c,147,n[0],n[1],'square',.1,500);
    });
  }
  function sfxFan(){ /* ちゃらららん */
    var c=ac(); if(!c) return;
    var run=[523,659,784,1047,1319,1568];
    run.forEach(function(f,i){note(c,f,i*.09,.2,'triangle',.22)});
    var t=run.length*.09+.04;
    [523,659,784,1047].forEach(function(f){note(c,f,t,1.3,'triangle',.15)});
    note(c,2093,t,1,'sine',.05);
  }

  /* ---------- 花吹雪（ゆっくり落ちる） ---------- */
  var CF={raf:0};
  function stopConfetti(){
    if(CF.raf){cancelAnimationFrame(CF.raf);CF.raf=0}
    var cv=$('#confetti');
    if(cv&&cv.getContext){var x=cv.getContext('2d');if(x) x.clearRect(0,0,cv.width,cv.height)}
  }
  function confetti(){
    var cv=$('#confetti');
    if(!cv||!cv.getContext) return;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    stopConfetti();
    var ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1, W=window.innerWidth, H=window.innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    var cols=['#ef476f','#ffd166','#06d6a0','#118ab2','#8e6bf2','#ff9f1c','#4cc9f0','#f78fb3'];
    var n=Math.min(150,Math.max(60,Math.round(W/7))), ps=[], i;
    for(i=0;i<n;i++) ps.push({
      x:Math.random()*W, y:-20-Math.random()*H*0.9,
      w:6+Math.random()*7, h:9+Math.random()*9, c:cols[i%cols.length],
      vy:38+Math.random()*42, vx:(Math.random()-.5)*24,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*2.4,
      ph:Math.random()*6.28, sw:14+Math.random()*26
    });
    var t0=null, last=0;
    function frame(ts){
      if(t0===null){t0=ts;last=ts}
      var dt=Math.min(.05,(ts-last)/1000), t=(ts-t0)/1000; last=ts;
      ctx.clearRect(0,0,W,H);
      var alive=0;
      ps.forEach(function(p){
        p.y+=p.vy*dt; p.x+=p.vx*dt+Math.sin(t*1.6+p.ph)*p.sw*dt; p.rot+=p.vr*dt;
        if(p.y<H+30){
          alive++;
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          ctx.scale(1,Math.cos(t*2.2+p.ph)); /* ひらひら */
          ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
          ctx.restore();
        }
      });
      if(alive>0&&t<30) CF.raf=requestAnimationFrame(frame);
      else{CF.raf=0;ctx.clearRect(0,0,W,H)}
    }
    CF.raf=requestAnimationFrame(frame);
  }

  /* ---------- 問題づくり ---------- */
  function convDis(dir,deg,pool){
    var sc=function(x){
      var s=Math.random()*1.6;
      if(dir==='d2r'){var a=radParts(deg),b=radParts(x); if(a.d===b.d)s+=2; if(a.n===b.n)s+=2;}
      else s-=Math.abs(x-deg)/50;
      return s;
    };
    return pool.filter(function(x){return x!==deg}).map(function(x){return {x:x,s:sc(x)}})
      .sort(function(a,b){return b.s-a.s}).slice(0,3).map(function(o){return o.x});
  }
  function trigDis(fn,deg,correct){
    var out=[];
    var add=function(t){if(t&&t!==correct&&out.indexOf(t)<0&&POOLV[fn].indexOf(t)>=0) out.push(t)};
    var flip=function(t){return (t==='0'||t==='N')?null:(t.charAt(0)==='-'?t.slice(1):'-'+t)};
    add(flip(correct));
    if(fn==='sin') add(COS[deg]); else if(fn==='cos') add(SIN[deg]);
    else add({'1/r3':'r3','r3':'1/r3','-1/r3':'-r3','-r3':'-1/r3'}[correct]);
    shuffle(POOLV[fn]).forEach(add);
    return out.slice(0,3);
  }
  function assemble(correct,dis){
    var arr=shuffle(dis), pos=pickPos();
    arr.splice(pos,0,correct);
    return arr;
  }

  function buildQ(item){
    var q={item:item,rep:false}, deg=item.deg, ch;
    if(item.type==='conv'){
      var pool=anglesFor(ST.range,false);
      var p=radParts(deg);
      if(item.dir==='d2r'){
        q.label='度数法 → 弧度法';
        q.prompt=deg+'° ＝ <span class="blank">？</span>';
        q.ans=radHTML(deg);
        q.sum=deg+'° ＝ '+radHTML(deg);
        q.expl='1° ＝ '+M(piFrac(1,180))+' なので、'+M(deg+'° × '+piFrac(1,180)+' ＝ '+piFrac(deg,180)+' ＝ '+radHTML(deg));
        ch=assemble({html:radHTML(deg),ok:true},convDis('d2r',deg,pool).map(function(x){return {html:radHTML(x),ok:false}}));
      }else{
        q.label='弧度法 → 度数法';
        q.prompt=radHTML(deg)+' ＝ <span class="blank">？</span>°';
        q.ans=deg+'°';
        q.sum=radHTML(deg)+' ＝ '+deg+'°';
        var how;
        if(p.d===1&&p.n===1) how='π ＝ 180°';
        else if(p.d===1) how='180° × '+p.n+' ＝ '+deg+'°';
        else if(p.n===1) how='180° ÷ '+p.d+' ＝ '+deg+'°';
        else how='180° × '+p.n+' ÷ '+p.d+' ＝ '+deg+'°';
        q.expl='π ＝ 180° に置きかえて、'+M(radHTML(deg))+' ＝ '+M(how);
        ch=assemble({html:deg+'°',ok:true},convDis('r2d',deg,pool).map(function(x){return {html:x+'°',ok:false}}));
      }
      q.hint={mode:'conv',dir:item.dir};
    }else{
      var fn=item.fn, tbl=TBL[fn], ans=tbl[deg];
      q.label=fn+' の値を求めよう（弧度法）';
      q.prompt=fn+' '+radHTML(deg)+' ＝ <span class="blank">？</span>';
      q.ans=tokHTML(ans);
      q.sum=fn+' '+radHTML(deg)+' ＝ '+tokHTML(ans);
      var pt=M('( '+tokHTML(COS[deg])+' , '+tokHTML(SIN[deg])+' )');
      var e=M(radHTML(deg))+' ＝ '+deg+'°。単位円で '+deg+'° の点は '+pt+'。';
      if(fn==='sin') e+=' sin は y座標なので '+M(tokHTML(ans))+'。';
      else if(fn==='cos') e+=' cos は x座標なので '+M(tokHTML(ans))+'。';
      else if(ans==='N') e+=' tan ＝ y ÷ x だけど x ＝ 0 なので割れません。tan は<b>定義できない</b>。';
      else{
        var xs=COS[deg], xh=tokHTML(xs); if(xs.charAt(0)==='-') xh='( '+xh+' )';
        e+=' tan ＝ y ÷ x ＝ '+M(tokHTML(SIN[deg])+' ÷ '+xh+' ＝ '+tokHTML(ans))+'。';
      }
      q.expl=e;
      ch=assemble({html:tokHTML(ans),ok:true},trigDis(fn,deg,ans).map(function(t){return {html:tokHTML(t),ok:false}}));
      q.hint={mode:'trig',fn:fn,deg:deg};
    }
    q.choices=ch;
    return q;
  }

  function makeItems(){
    var trig=ST.tab!=='conv', ang=anglesFor(ST.range,trig), items;
    if(ST.tab==='conv') items=ang.map(function(d){return {type:'conv',dir:ST.dir,deg:d}});
    else if(ST.tab==='mix'){items=[];ang.forEach(function(d){['sin','cos','tan'].forEach(function(f){items.push({type:'trig',fn:f,deg:d})})})}
    else items=ang.map(function(d){return {type:'trig',fn:ST.tab,deg:d}});
    return shuffle(items).slice(0,10);
  }

  /* まちがえた問題は、このあと3回（間をあけて）もう一度出す */
  function addRepeats(q){
    var have=0, k;
    for(k=ST.i+1;k<ST.qs.length;k++) if(ST.qs[k].sum===q.sum) have++;
    for(var j=0;j<3-have;j++){
      var nq=buildQ(q.item); nq.rep=true;
      var pos=Math.min(ST.qs.length, ST.i+3*(have+j+1)+Math.floor(Math.random()*2));
      ST.qs.splice(pos,0,nq);
    }
  }

  /* ---------- 単位円（ヒント） ---------- */
  /* 数字ありは、角ごとの数字を円のまわりに詰めず、左右の列にならべて線でつなぐ（重ならない）。
     分数は HTML の縦書き分数（frac）を foreignObject の中に置いて表示する。 */
  var RIGHT=[60,45,30,0,330,315,300], LEFT=[120,135,150,180,210,225,240];
  function fo(x,y,w,h,inner,al,va){
    return '<foreignObject x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="justify-content:'+({start:'flex-start',end:'flex-end',center:'center'}[al])+';align-items:'+(va||'center')+'">'+inner+'</div></foreignObject>';
  }
  function lb(inner,on,cls){return '<span class="lb'+(on?' on':'')+(cls?' '+cls:'')+'">'+inner+'</span>'}
  function radLabel(a){return '<span class="rl">'+(a===0?'0, 2π':radHTML(a))+'</span>'}
  function coordHTML(a,fn,on){
    var cx=tokHTML(COS[a]), cy=tokHTML(SIN[a]);
    if(on&&fn==='cos') cx='<span class="hx">'+cx+'</span>';
    if(on&&fn==='sin') cy='<span class="hy">'+cy+'</span>';
    return '<span class="co2"><span>(</span>'+cx+'<span>,</span>'+cy+'<span>)</span></span>';
  }
  function svgOpen(x0,y0,w,h,minw){
    return '<svg class="uc" viewBox="'+x0+' '+y0+' '+w+' '+h+'"'+(minw?' style="min-width:'+minw+'px"':'')+' role="img" aria-label="単位円">';
  }

  /* tan 用：半径をのばして、直線 x＝1 とぶつかった点の y座標が tan θ */
  function tanCircleSVG(hl,lab){
    var R=112, RAD=Math.PI/180;
    var r1=function(v){return Math.round(v*10)/10};
    var RS=[0,30,45,60,300,315,330];            /* 半径が x＝1 側にぶつかる角（cos>0） */
    var ty=function(a){return r1(-R*Math.tan(a*RAD))};
    var hlA=hl==null?null:(hl===360?0:hl);
    var c=hlA==null?0:Math.cos(hlA*RAD), sn=hlA==null?0:Math.sin(hlA*RAD);
    var undef=hlA===90||hlA===270;
    var eq=hlA==null||undef?-1:(c>0.001?hlA:(hlA+180)%360);
    var rowH=58, colW=64, xc=R+28;
    var vxl=lab?xc+colW+6:R+26, vxr=lab?R+14+178:R+30, vy=lab?250:210;
    var s=svgOpen(-vxl,-vy,vxl+vxr,2*vy,0);

  /* 角度の変換・sin・cos 用 */
  function circleSVG(mode,fn,hl,lab){
    if(mode==='trig'&&fn==='tan') return tanCircleSVG(hl,lab);
    var R=108, RAD=Math.PI/180, trig=mode==='trig', hlA=hl===360?0:hl;
    var r1=function(v){return Math.round(v*10)/10};
    var rowH=trig?104:68, colW=trig?112:64, xc=R+28, HX=xc+colW+6;
    var vx=lab?HX:R+26, vy=lab?Math.max(3.5*rowH,R+12+rowH-6)+6:R+26;
    var s=svgOpen(-vx,-vy,2*vx,2*vy,0);
    s+='<circle class="u-circ" r="'+R+'"/>';
    ANG.forEach(function(a){
      s+='<line class="u-sp" x1="0" y1="0" x2="'+r1(R*Math.cos(a*RAD))+'" y2="'+r1(-R*Math.sin(a*RAD))+'"/>';
    });

    if(lab){
      [[RIGHT,1],[LEFT,-1]].forEach(function(p){p[0].forEach(function(a,k){
        var y=(k-3)*rowH, on=trig&&a===hlA;
        s+='<line class="u-ld'+(on?' on':'')+'" x1="'+r1(R*Math.cos(a*RAD))+'" y1="'+r1(-R*Math.sin(a*RAD))+'" x2="'+(p[1]*(xc-4))+'" y2="'+y+'"/>';
      })});
    }
    if(trig && lab && hl!=null){
      var x=r1(R*Math.cos(hlA*RAD)), y0=r1(-R*Math.sin(hlA*RAD));
      if(hl===360) s+='<circle class="u-arc" r="30"/>';
      else if(hl>0){
        s+='<path class="u-arc" d="M30 0A30 30 0 '+(hl>180?1:0)+' 0 '+r1(30*Math.cos(hl*RAD))+' '+r1(-30*Math.sin(hl*RAD))+'"/>';
      }
      s+='<line class="u-foot" x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="0"/>';
      s+='<line class="u-hl" x1="0" y1="0" x2="'+x+'" y2="'+y0+'"/>';
      if(fn==='sin') s+='<line class="u-hy" x1="'+x+'" y1="0" x2="'+x+'" y2="'+y0+'"/>';
      if(fn==='cos') s+='<line class="u-hx" x1="0" y1="0" x2="'+x+'" y2="0"/>';
    }
    ANG.forEach(function(a){
      var c=Math.cos(a*RAD), sn=Math.sin(a*RAD), on=lab&&trig&&a===hlA;
      var i0=a%90===0?10:6, o0=a%90===0?12:8;
      s+='<line class="u-tk" x1="'+r1((R-i0)*c)+'" y1="'+r1(-(R-i0)*sn)+'" x2="'+r1((R+o0)*c)+'" y2="'+r1(-(R+o0)*sn)+'"/>';
      s+='<circle class="u-dot'+(on?' on':'')+'" cx="'+r1(R*c)+'" cy="'+r1(-R*sn)+'" r="'+(on?6:3.5)+'"/>';
    });
    if(!lab) return s+'</svg>';
    ANG.forEach(function(a){
      var c=Math.cos(a*RAD), sn=Math.sin(a*RAD), dx,dy,da='middle';
      if(a===0){dx=R-9;dy=5;da='end'}
      else if(a===180){dx=-(R-9);dy=5;da='start'}
      else{dx=r1((R-26)*c);dy=r1(-(R-26)*sn+5)}
      s+='<text class="u-deg" x="'+dx+'" y="'+dy+'" text-anchor="'+da+'">'+(a===0?'0°=360°':a+'°')+'</text>';
    });
    [[RIGHT,1],[LEFT,-1]].forEach(function(p){p[0].forEach(function(a,k){
      var y=(k-3)*rowH, on=trig&&a===hlA;
      var inner=lb(radLabel(a)+(trig?coordHTML(a,fn,on):''),on,trig?'v':'');
      s+=p[1]>0?fo(xc,y-rowH/2,colW,rowH,inner,'start'):fo(-xc-colW,y-rowH/2,colW,rowH,inner,'end');
    })});
    [[90,-1],[270,1]].forEach(function(p){
      var a=p[0], on=trig&&a===hlA, h=rowH-6, w=trig?colW:80;
      var inner=lb(radLabel(a)+(trig?coordHTML(a,fn,on):''),on,trig?'v':'');
      s+=fo(-w/2,p[1]<0?-(R+12)-h:(R+12),w,h,inner,'center',p[1]<0?'flex-end':'flex-start');

  function hintHTML(q,lab){
    if(!lab) return circleSVG(q.hint.mode,q.hint.fn,q.hint.deg,false);

        : '<b>π ＝ 180°</b> に置きかえよう。たとえば '+piFrac(1,4)+' なら 180° ÷ 4 ＝ 45°。';
      note='<span>外側：ラジアン（弧度法）</span><span>内側：度（度数法）</span>';
    }else{
      tip={sin:'<b>sin θ</b> は、単位円周上の点の <b>y座標</b>（たて）。',
           cos:'<b>cos θ</b> は、単位円周上の点の <b>x座標</b>（よこ）。',
           tan:'<b>tan θ</b> は、半径を<b>のばして</b>、直線 <b>x ＝ 1</b> とぶつかった点の <b>y座標</b>。90° より大きい角は、原点をこえて反対がわへのばそう。90°・270° は x ＝ 1 と平行で交わらないので、定義できない。'}[h.fn];

    }
    return '<p class="tip">'+tip+'</p>'+circleSVG(h.mode,h.fn,h.deg,true)+'<p class="note">'+note+'</p>';
  }

  /* ---------- 画面の更新 ---------- */

  function showQ(){
    var q=ST.qs[ST.i];

    $('#scoreChip').textContent='正解 '+ST.score;

      b.innerHTML='<span class="no">'+'①②③④'.charAt(idx)+'</span><span class="val">'+c.html+'</span>';
      b.addEventListener('click',function(){answer(idx)});
      box.appendChild(b);
    });

    renderHint();
    try{ /* 単位円を開いたままでも、新しい問題が見えるようにもどす */

  function answer(idx){
    if(ST.answered) return;
    ST.answered=true;
    var q=ST.qs[ST.i], ok=q.choices[idx].ok;
    document.querySelectorAll('#choices .choice').forEach(function(b,k){
      b.disabled=true;
      var no=b.querySelector('.no');

      else if(k===idx){b.classList.add('is-ng');no.textContent='✕'}
      else b.classList.add('is-dim');
    });
    var fb=$('#fb');
    if(ok){
      if(!q.rep) ST.score++;
      sfxOk();
      fb.className='fb ok';
      $('#fbTitle').textContent='せいかい！';
      $('#fbEx').hidden=true;$('#fbNote').hidden=true;$('#nextBtn').hidden=true;
      fb.hidden=false;
      ST.timer=setTimeout(next,1500);

      ST.mistakes++;ST.wrong.push(q);

    var pool=G.range===0?R1.slice():G.range===1?R2.slice():R1.concat(R2);
    var n=G.range===2?10:8;
    G.qs=shuffle(pool).slice(0,n).map(function(d){return {deg:d,kind:G.kind==='mix'?(Math.random()<.5?'rad':'deg'):G.kind}});
    G.i=0;G.score=0;G.wrong=[];
    $('#gRes').hidden=true;$('#game').hidden=false;
    gShow();
  }
  function gShow(){
    clearTimeout(G.timer);
    G.sel=0;G.done=false;
    var q=G.qs[G.i].deg, qk=G.qs[G.i].kind;
    $('#gNo').textContent='第 '+(G.i+1)+' 問 / '+G.qs.length;
    $('#gScore').textContent='正解 '+G.score;
    $('#gBar').style.width=(G.i/G.qs.length*100)+'%';
    $('#gQ').innerHTML=(qk==='deg'?'<span>'+q+'°</span>':radHTML(q))+' <span class="und" style="font-size:.5em">まで</span>';
    $('#gFb').hidden=true;
    var a=$('#gAns');a.classList.add('hide');a.setAttribute('d','');
    $('#gFill').setAttribute('class','g-fill hide');
    gPaint();gHintRender();
  }
  function gSet(ang){
    if(G.done||ang==null) return;
    var s=gSnap(ang);
    if(s!==G.sel){G.sel=s;gPaint();if(s){var c=ac();if(c&&soundOn) note(c,520+s,0,.06,'sine',.08)}}
  }
  function gAngle(e){
    var svg=$('#gSvg'), pt=svg.createSVGPoint();
    pt.x=e.clientX;pt.y=e.clientY;
    var m=pt.matrixTransform(svg.getScreenCTM().inverse());
    if(Math.sqrt(m.x*m.x+m.y*m.y)<18) return null;
    var a=Math.atan2(-m.y,m.x)*180/Math.PI;
    return a<0?a+360:a;
  }
  function gBoth(q){return radHTML(q)+' ＝ '+q+'°'}
  function gJudge(){
    if(G.done||!G.sel) return;
    G.done=true;
    var o=G.qs[G.i], q=o.deg, ok=G.sel===q, fb=$('#gFb');
    fb.hidden=false;fb.className='gfb '+(ok?'ok':'ng');
    $('#gFill').setAttribute('class','g-fill '+(ok?'ok':'ng'));
    if(ok){
      G.score++;sfxOk();
      $('#gScore').textContent='正解 '+G.score;
      $('#gFt').textContent='ピンポーン！ 正解';
      $('#gEx').innerHTML=gBoth(q);
      $('#gNext').hidden=true;
      G.timer=setTimeout(gNext,1500);
    }else{
      sfxNg();G.wrong.push(o);
      var a=$('#gAns');a.setAttribute('d',wedge(q));a.classList.remove('hide');
      $('#gFt').textContent='ブッブー ざんねん';
      $('#gEx').innerHTML=gBoth(q)+' まで<br><small style="font-size:.6em;font-family:var(--font-ui)">（みどりの点線が正解）</small>';
      $('#gNext').hidden=false;$('#gNext').textContent=G.i+1>=G.qs.length?'結果を見る':'次の問題へ';
    }
  }
  function gNext(){
    clearTimeout(G.timer);
    G.i++;
    if(G.i>=G.qs.length) return gFinish();
    gShow();
  }
  function gFinish(){
    $('#game').hidden=true;$('#gRes').hidden=false;
    $('#gResScore').textContent=G.score;$('#gResOf').textContent=' / '+G.qs.length;
    var perfect=G.score===G.qs.length;
    setMsg($('#gResMsg'),perfect,G.wrong.length,'パーフェクト！ぜんぶ正解！','まちがえた角は下の一覧。もう一度チャレンジしよう。');
    var ul=$('#gResWrong');ul.innerHTML='';
    G.wrong.forEach(function(o){var li=document.createElement('li');li.innerHTML=gBoth(o.deg);ul.appendChild(li)});
    if(perfect) setTimeout(function(){sfxFan();confetti()},250);
  }
  function gHintRender(){
    var el=$('#gHint');
    $('#gHintPlain').setAttribute('aria-pressed',String(G.hint==='plain'));
    $('#gHintFull').setAttribute('aria-pressed',String(G.hint==='full'));
    if(!G.hint){el.hidden=true;el.innerHTML='';return}
    el.hidden=false;
    el.innerHTML=circleSVG('conv',null,null,G.hint==='full')+(G.hint==='full'?'<p class="note"><span>外側：ラジアン</span><span>内側：度</span></p>':'');
  }
  function setMode(m){
    var cur=G.mode==='game'?'game':(ST.tab==='conv'?'conv':'trig');
    if(m===cur) return;
    clearTimeout(G.timer);stopConfetti();
    if(m==='game'){
      G.wasResult=!$('#result').hidden;
      $('#setPanel').hidden=true;$('#quiz').hidden=true;$('#result').hidden=true;
      G.mode='game';
      gStart();
    }else{
      var fromGame=G.mode==='game';
      G.mode='drill';
      ST.tab=m==='conv'?'conv':(ST.tab==='conv'?'sin':ST.tab);
      $('#game').hidden=true;$('#gRes').hidden=true;
      $('#setPanel').hidden=false;
      save();
      if(fromGame&&G.wasResult&&m===(G.lastDrill||m)){
        $('#quiz').hidden=true;$('#result').hidden=false;
      }else{
        $('#quiz').hidden=false;$('#result').hidden=true;start();
      }
    }
    if(m!=='game') G.lastDrill=m;
    renderSettings();
  }
  (function(){
    var svg=$('#gSvg');
    gBuild();
    svg.addEventListener('pointerdown',function(e){
      if(G.done) return;
      G.drag=true;try{svg.setPointerCapture(e.pointerId)}catch(x){}
      gSet(gAngle(e));e.preventDefault();
    });
    svg.addEventListener('pointermove',function(e){if(G.drag) gSet(gAngle(e))});
    ['pointerup','pointercancel'].forEach(function(t){svg.addEventListener(t,function(){var d=G.drag;G.drag=false;if(d) gJudge()})});
    $('#gKind').addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b) return;
      G.kind=b.dataset.v;
      document.querySelectorAll('#gKind button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
      gStart();
    });
    $('#gNext').addEventListener('click',gNext);
    $('#gAgain').addEventListener('click',gStart);
    $('#gRange').addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b) return;
      G.range=Number(b.dataset.v);
      document.querySelectorAll('#gRange button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
      gStart();
    });
    $('#gHintPlain').addEventListener('click',function(){G.hint=G.hint==='plain'?null:'plain';gHintRender()});
    $('#gHintFull').addEventListener('click',function(){G.hint=G.hint==='full'?null:'full';gHintRender()});
    $('#segMode').addEventListener('click',function(e){var b=e.target.closest('button');if(b) setMode(b.dataset.v)});
  })();

  G.lastDrill=ST.tab==='conv'?'conv':'trig';
  renderSettings();
  start();
})();
</script>
